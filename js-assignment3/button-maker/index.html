<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Button Maker</h1>
        <form action="">
            <label for="button-text">Background Color:</label>
            <input type="color" id="button-color" name="button-color" required>
            <br>
            <label for="font-color">Font Color:</label>
            <input type="color" id="font-color" name="font-color" required>
            <br>
            <label for="font-size">Font Size:</label>
            <input type="number" id="font-size" name="font-size" required>
            <br>
            <label for="font-weight">Font Weight:</label>
            <input type="text" id="font-weight" name="font-weight" required>
            <br>
            <label for="padding">Padding:</label>
            <input type="text" id="padding" name="padding" required>
            <br>
            <label for="button-radius">Button Radius:</label>
            <input type="number" id="button-radius" name="button-radius" required>
            <button type="submit">Apply</button>
        </form>

        <div id="result">
            <p>Result: </p>
            <button id="result-button">Custom Button</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
