<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Todo App</h1>
        <form action="">
            <label for="todo-item">Add a new todo:</label>
            <input type="text" id="todo-item" name="todo-item" required>
            <button type="submit">Add</button>
        </form>
        <ul id="todo-list"></ul>
    </main>

    <script src="script.js"></script>
</body>

</html>
