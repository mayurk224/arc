<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main>
        <h1>Color Picker</h1>
        <div class="container">
            <button class="btn-div white" id="white-btn">
                <p>White</p>
                <p>#ffffff</p>
            </button>
            <button class="btn-div green" id="green-btn">
                <p>Green</p>
                <p>#00ff00</p>
            </button>
            <button class="btn-div blue" id="blue-btn">
                <p>Blue</p>
                <p>#0000ff</p>
            </button>
            <button class="btn-div red" id="red-btn">
                <p>Red</p>
                <p>#ff0000</p>
            </button>
        </div>
        <div class="preview">
            <h1>Background color: <span id="color-code"></span></h1>
            <p>Click on the buttons to change the background color</p>
        </div>
    </main>

    <script src="./script.js"></script>
</body>

</html>
