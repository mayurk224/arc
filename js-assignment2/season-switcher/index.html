<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <div class="image-container">
            <img src="https://images.pexels.com/photos/33565380/pexels-photo-33565380.jpeg" alt="" id="summer">
            <img src="https://images.pexels.com/photos/19962564/pexels-photo-19962564.jpeg" alt="" id="winter">
            <img src="https://images.pexels.com/photos/1080392/pexels-photo-1080392.jpeg" alt="" id="spring">
            <img src="https://images.pexels.com/photos/37465994/pexels-photo-37465994.jpeg" alt="" id="rainy">
        </div>

        <div class="btn-container">
            <button id="summer-btn">Summer</button>
            <button id="winter-btn">Winter</button>
            <button id="spring-btn">Spring</button>
            <button id="rainy-btn">Rainy</button>
        </div>
     </main>

    <script src="script.js"></script>
</body>

</html>
